<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5bd8">
  <title>토익 단어</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="banner" class="banner" hidden>기록을 저장할 수 없습니다. 브라우저 저장 설정을 확인하세요.</div>

  <header class="topbar">
    <div id="progress" class="progress">불러오는 중…</div>
    <button id="settings-btn" class="text-btn" type="button" aria-expanded="false" aria-controls="settings">⚙ 설정</button>
  </header>

  <div id="settings" class="settings" hidden>
    <h2>하루 문제 수</h2>
    <div id="daily-options" class="segmented" role="group" aria-label="하루 문제 수"></div>

    <h2>정답이면 자동으로 다음 문제</h2>
    <div id="auto-options" class="segmented" role="group" aria-label="자동 다음"></div>

    <h2>발음 자동 재생</h2>
    <div id="play-options" class="segmented" role="group" aria-label="발음 자동 재생"></div>

    <h2>글자 크기</h2>
    <div id="font-options" class="segmented" role="group" aria-label="글자 크기"></div>

    <h2>화면 색</h2>
    <div id="theme-options" class="segmented" role="group" aria-label="화면 색"></div>

    <button id="stats-btn" class="wide-btn" type="button">📊 통계 · 오답 노트 보기</button>
    <p id="settings-msg" class="menu-msg" role="status"></p>
  </div>

  <main id="main" class="main">
    <section id="quiz" hidden>
      <div class="card">
        <div id="pos" class="pos"></div>
        <div id="word" class="word"></div>
        <button id="speak-btn" class="speak" type="button" aria-label="발음 듣기" hidden>🔊 발음 듣기</button>
      </div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback" hidden>
        <div id="feedback-text"></div>
        <div id="feedback-extra" class="extra"></div>
        <button id="next-btn" class="next" type="button">다음</button>
      </div>
    </section>

    <section id="done" hidden>
      <h1>오늘 학습 끝!</h1>
      <p id="done-summary"></p>
      <h2>오늘 틀린 단어</h2>
      <ul id="done-wrong" class="wrong-list"></ul>
      <p id="done-hint" class="hint"></p>
    </section>

    <section id="stats" hidden>
      <h1>학습 통계</h1>
      <dl id="stats-summary" class="stats-grid"></dl>
      <h2>오답 노트 <span class="hint">(많이 틀린 순)</span></h2>
      <ul id="stats-wrong" class="wrong-list"></ul>
      <button id="stats-back" class="next" type="button">돌아가기</button>
    </section>

    <section id="error" hidden>
      <p id="error-text"></p>
    </section>
  </main>
  <section class="backup" aria-label="기록 백업">
    <button id="export-btn" type="button">기록 내보내기</button>
    <button id="import-btn" type="button">기록 가져오기</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <p id="menu-msg" class="menu-msg" role="status"></p>
  </section>

  <footer class="credit">단어 출처: TOEIC Service List (Browne &amp; Culligan, CC BY-SA 4.0) 외 · <a href="NOTICE.md">자세히</a></footer>

  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('service worker failed', e));
    }
  </script>
</body>
</html>
